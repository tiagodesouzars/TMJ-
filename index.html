    <script>
      // Compatibility guard: ensure window.fetch can be modified by browser extensions/interceptors
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch.bind(window);
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get() { return currentFetch; },
            set(fn) { currentFetch = fn; }
          });
        }
      } catch (e) {}

      // Suppress external extension errors from breaking application execution
      window.addEventListener('error', function(e) {
        if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
